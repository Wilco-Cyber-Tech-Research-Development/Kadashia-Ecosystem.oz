# Kadashia Sovereign Ecosystem — Netlify configuration
# One unified platform. Nothing stands alone.
# Owner: Joseph Lual · Perth WA · ABN 92 845 954 362

[build]
  publish = "."
  command = "echo 'Kadashia Sovereign Ecosystem — static publish'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300"
